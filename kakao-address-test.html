<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화곡동 주소검색 진단</title>
<style>
body{font-family:Arial,"Malgun Gothic",sans-serif;background:#f5f7fa;margin:0;color:#172033}
.wrap{max-width:850px;margin:24px auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 8px}
.note{color:#667085;margin-bottom:15px}
#summary{padding:13px;border-radius:10px;background:#eef2f6;font-weight:700;margin-bottom:12px}
.row{padding:11px 12px;border:1px solid #e4e7ec;border-radius:9px;margin:8px 0}
.q{font-weight:700}
.ok{color:#067647}.bad{color:#b42318}.wait{color:#667085}
pre{background:#111827;color:#e5e7eb;padding:14px;border-radius:10px;white-space:pre-wrap;overflow:auto}
#map{height:380px;border-radius:12px;overflow:hidden;background:#e5e7eb;margin-top:14px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>화곡동 주소 → 좌표 진단</h1>
<div class="note">카카오가 실제 화곡동 주소를 어떤 상태로 응답하는지 확인합니다.</div>
<div id="summary">검사 중...</div>
<div id="results"></div>
<pre id="log"></pre>
<div id="map"></div>
</div></div>
<script>
const KEY='a6474ae1c2b07f004d0ebc5dd68d98f6';
const tests=[
  ['지번주소','서울특별시 강서구 화곡동 968-3'],
  ['도로명주소','서울특별시 강서구 까치산로20길 9-13'],
  ['동 주소','서울특별시 강서구 화곡동']
];
const $results=document.getElementById('results');
const $summary=document.getElementById('summary');
const $log=document.getElementById('log');
function log(s){$log.textContent+=s+'\n';}
function add(label,q,status,detail,ok){
  const d=document.createElement('div');
  d.className='row';
  d.innerHTML='<div class="q">'+label+' : '+q+'</div><div class="'+(ok?'ok':'bad')+'">상태: '+status+'</div><div>'+detail+'</div>';
  $results.appendChild(d);
}
const s=document.createElement('script');
s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(KEY)+'&autoload=false&libraries=services';
s.onload=()=>{
  log('SDK 파일 로드 성공');
  kakao.maps.load(async()=>{
    log('kakao.maps.load 성공');
    const map=new kakao.maps.Map(document.getElementById('map'),{
      center:new kakao.maps.LatLng(37.5488,126.8512), level:4
    });
    const geocoder=new kakao.maps.services.Geocoder();
    const places=new kakao.maps.services.Places();
    let success=0, first=null;

    function addressSearch(q){
      return new Promise(resolve=>{
        geocoder.addressSearch(q,(res,status)=>resolve({res,status}));
      });
    }
    function keywordSearch(q){
      return new Promise(resolve=>{
        places.keywordSearch(q,(res,status)=>resolve({res,status}));
      });
    }

    for(const [label,q] of tests){
      const a=await addressSearch(q);
      const ok=a.status===kakao.maps.services.Status.OK && a.res && a.res[0];
      log(label+' addressSearch => '+a.status);
      if(ok){
        const lat=Number(a.res[0].y), lon=Number(a.res[0].x);
        success++;
        if(!first) first={lat,lon,label,q};
        add(label,q,a.status,'좌표: '+lat+', '+lon,true);
      }else{
        const k=await keywordSearch(q);
        const kok=k.status===kakao.maps.services.Status.OK && k.res && k.res[0];
        log(label+' keywordSearch => '+k.status);
        if(kok){
          const lat=Number(k.res[0].y), lon=Number(k.res[0].x);
          success++;
          if(!first) first={lat,lon,label,q};
          add(label,q,'주소검색 '+a.status+' / 키워드검색 '+k.status,'키워드 좌표: '+lat+', '+lon,true);
        }else{
          add(label,q,'주소검색 '+a.status+' / 키워드검색 '+k.status,'좌표를 얻지 못했습니다.',false);
        }
      }
    }

    if(first){
      const pos=new kakao.maps.LatLng(first.lat,first.lon);
      map.setCenter(pos);
      new kakao.maps.Marker({map,position:pos});
    }
    $summary.textContent=success===tests.length
      ? '정상: 화곡동 테스트 주소 3개가 모두 좌표로 변환됐습니다.'
      : '확인 필요: '+tests.length+'개 중 '+success+'개만 좌표를 얻었습니다.';
    $summary.style.background=success===tests.length?'#e8f7ee':'#fff4e5';
  });
};
s.onerror=()=>{$summary.textContent='SDK 파일 로드 실패';log('SDK script error');};
document.head.appendChild(s);
</script>
</body>
</html>
